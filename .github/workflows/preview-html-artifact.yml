name: Preview HTML artifact
on:
  push:
    branches:
      - preview-formulario-adaptado
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: perigallo-formulario-preview
          path: preview-formulario-adaptado/index.html
          if-no-files-found: error
