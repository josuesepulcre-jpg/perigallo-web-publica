<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Eventos y entradas | Perigallo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/ticketing.css">
</head>
<body class="ticketing-page admin-page">
<header class="ticketing-nav">
  <a href="/" aria-label="Volver a Perigallo"><img class="ticketing-logo" src="/assets/images/perigallo-logo-original.png" alt="Perigallo"></a>
  <nav><a href="/eventos/">Eventos públicos</a><a href="/admin/entradas/acceso/">Accesos</a><button class="nav-button" type="button" data-admin-logout>Salir</button></nav>
</header>
<main class="ticketing-main">
  <section class="admin-hero">
    <div class="ticket-section-inner admin-hero-inner">
      <div><span class="ticket-eyebrow">Gestión Perigallo</span><h1 class="ticket-title">Eventos y <em>entradas</em></h1><p class="ticket-copy">Crea, edita y publica cada experiencia desde un único lugar. Los pedidos, pagos y accesos permanecen conectados.</p></div>
      <button class="ticket-btn primary" type="button" data-create-event>Crear evento</button>
    </div>
  </section>
  <section class="ticket-section">
    <div class="ticket-section-inner" data-admin-list hidden>
      <div class="admin-toolbar"><div><h2>Todos los eventos</h2><p class="ticket-copy">Borradores, fechas publicadas y archivo.</p></div><label class="admin-search"><span>Buscar</span><input type="search" data-event-search placeholder="Nombre, fecha o estado"></label></div>
      <p class="ticket-status" data-admin-status></p>
      <div class="admin-event-grid" data-admin-event-list></div>
    </div>
    <div class="ticket-section-inner" data-admin-login-wrap hidden>
      <div class="ticket-panel login-panel"><span class="ticket-eyebrow">Acceso privado</span><h2>Entrar al panel</h2><form class="ticket-form" data-admin-login><div class="ticket-form-grid"><div class="ticket-field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required></div><div class="ticket-field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div></div><button class="ticket-btn primary" type="submit">Entrar</button><p class="ticket-status" data-admin-status></p></form></div>
    </div>
  </section>
</main>
<script src="/assets/js/ticketing-admin.js" defer></script>
</body>
</html>
