<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Pedidos y ventas | Administración Perigallo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/ticketing.css?v=20260804-admin-v1">
<link rel="stylesheet" href="/assets/css/admin-orders.css?v=20260810-cash-orders-v1">
</head>
<body class="ticketing-page admin-backoffice-page">
<div class="admin-app-shell">
  <aside class="admin-sidebar" data-admin-nav></aside>
  <main class="admin-workspace" data-admin-sales-page>
    <p class="ticket-status is-error" data-admin-page-status hidden></p>
    <header class="admin-page-heading admin-page-heading-compact"><div><span class="ticket-eyebrow">Gestión</span><h1>Pedidos y <em>ventas</em></h1><p>Consulta el estado comercial de cada compra sin salir del backoffice.</p></div><button type="button" class="ticket-btn primary" data-open-cash-order>Generar entrada en efectivo</button></header>
    <section class="admin-sales-summary" data-admin-sales-summary aria-label="Resumen global de ventas"></section>
    <section class="admin-order-toolbar" aria-label="Filtros de pedidos">
      <div class="admin-filter-group" role="group" aria-label="Estado del pedido">
        <button type="button" class="is-active" data-admin-order-filter="active">Entradas activas</button>
        <button type="button" data-admin-order-filter="pending">Pendientes</button>
        <button type="button" data-admin-order-filter="cancelled">Cancelaciones</button>
        <button type="button" data-admin-order-filter="refunded">Devoluciones</button>
        <button type="button" data-admin-order-filter="tests">Pruebas</button>
        <button type="button" data-admin-order-filter="all">Todas</button>
      </div>
      <label class="admin-search"><span>Buscar pedido</span><input type="search" data-admin-sales-search placeholder="Comprador, evento, referencia o estado"></label>
    </section>
    <p class="admin-orders-status" data-admin-orders-status aria-live="polite"></p>
    <section class="admin-orders-list" data-admin-orders-list aria-live="polite"></section>
    <div class="admin-cash-modal" data-admin-cash-modal hidden>
      <div class="admin-cash-modal-card" role="dialog" aria-modal="true" aria-labelledby="cash-order-title">
        <button type="button" class="ticket-access-modal-close" data-close-cash-order aria-label="Cerrar">×</button>
        <span class="ticket-eyebrow">Operativa interna</span>
        <h2 id="cash-order-title">Entrada en efectivo</h2>
        <p>Genera una venta cobrada o una reserva pendiente. Nunca aparecerá como opción en la web pública.</p>
        <form class="admin-cash-order-form" data-admin-cash-order-form>
          <label class="admin-form-span">Evento<select name="event_id" required data-cash-event><option value="">Selecciona un evento</option></select></label>
          <div class="admin-cash-ticket-lines" data-cash-ticket-lines><p>Selecciona un evento para elegir las entradas.</p></div>
          <label>Nombre<input name="first_name" required maxlength="120" autocomplete="given-name"></label>
          <label>Apellidos<input name="last_name" maxlength="160" autocomplete="family-name"></label>
          <label class="admin-form-span">Teléfono / WhatsApp<input name="phone" required maxlength="60" autocomplete="tel" inputmode="tel" placeholder="600 000 000 o +34 600 000 000"></label>
          <label>Estado del efectivo<select name="cash_payment_status" data-cash-payment-status><option value="paid">Pagado en efectivo</option><option value="reserved">Reserva pendiente de cobro</option></select></label>
          <label data-cash-expiry-wrap>Reserva válida hasta<input type="datetime-local" name="reservation_expires_at" data-cash-expiry></label>
          <label class="admin-form-span">Apunte de pago o reserva<textarea name="cash_payment_notes" maxlength="1000" placeholder="Ej.: paga al llegar; 174 € recibidos en efectivo."></textarea></label>
          <p class="admin-form-status admin-form-span" data-cash-order-status aria-live="polite"></p>
          <div class="admin-cash-form-actions admin-form-span"><button type="button" class="ticket-btn" data-close-cash-order>Cancelar</button><button type="submit" class="ticket-btn primary">Generar y abrir WhatsApp</button></div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="/assets/js/admin-backoffice.js?v=20260817-cash-whatsapp-v1" defer></script>
</body>
</html>
